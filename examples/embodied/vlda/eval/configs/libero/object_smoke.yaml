# Fill local paths and use a stage 2 VLDA checkpoint.
benchmark:
  name: libero
  suite: libero_object
  max_tasks: 1
  episodes_per_task: 1
  max_steps: 300
  num_steps_wait: 10
  continuous_gripper: true

model:
  backend: loongforge
  model_type: vlda
  name: loongforge-vlda-object-smoke
  stage: 2
  action_dim: 7
  state_dim: 8
  action_horizon: 10
  delta_token_num: 16
  discrete_state_input: true
  state_encoding: libero_ee_axis_angle
  action_encoding: axis_angle

server:
  host: 127.0.0.1
  port: 12093
  health_port: 12094
  python: /path/to/loongforge/bin/python
  log: /path/to/reports/vlda/policy_server.log
  start_timeout_sec: 900
  ckpt_path: /path/to/stage2/checkpoints/steps_160000
  dataset_statistics_path: /path/to/stage2/checkpoints/steps_160000/assets/norm_stats.json
  tokenizer_path: /path/to/paligemma_tokenizer.model
  loongforge_root: /path/to/LoongForge
  use_bf16: false

env:
  eval_root: /path/to/LoongForge/loongforge/embodied/eval
  libero_config_path: /path/to/libero_config
  mujoco_gl: osmesa
  pyopengl_platform: osmesa

run:
  output_dir: /path/to/reports/vlda/libero
  seed: 7
  save_trace: true
  save_replay: true

timeouts:
  policy_call_ms: 600000
  per_step_sec: 600
  per_episode_sec: 900
