# VLDA RoboTwin uses Aloha joint conversion and 50-step action chunks.
model:
  model_type: vlda
  stage: 1
  action_dim: 14
  state_dim: 14
  action_horizon: 50
  discrete_state_input: true
  crop_action_sequences: 10
  delta_token_num: 16
  gradient_checkpointing: true
  disable_train_autocast: true

data:
  camera_keys: [observation.images.cam_high, observation.images.cam_left_wrist, observation.images.cam_right_wrist]
  state_key: observation.state
  action_key: action
  adapt_to_pi: true
  delta_joint_actions: true
  vjepa_image_cache_dir: vjepa256/base_0_rgb
